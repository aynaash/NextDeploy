app:
  name: stress-benchmark-app
  port: 3000
  gosidecar:
    enabled: true
    image_optimization: true
    isr_cache: true

target_type: vps

strategy:
  rolling:
    batch_size: 1
    health_check_delay: 2s
    max_unavailable: 1

servers:
  - name: web-01
    host: 127.0.0.1
    port: 2201
    username: root
    key_path: ../test_ed25519
  - name: web-02
    host: 127.0.0.1
    port: 2202
    username: root
    key_path: ../test_ed25519
  - name: web-03
    host: 127.0.0.1
    port: 2203
    username: root
    key_path: ../test_ed25519
