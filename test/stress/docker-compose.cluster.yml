version: "3.8"

networks:
  stress-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  lb-01:
    image: nginx:alpine
    container_name: nextdeploy-stress-lb-01
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      stress-cluster-net:
        ipv4_address: 172.28.0.10
    depends_on:
      - web-01
      - web-02
      - web-03
    restart: unless-stopped

  web-01:
    build:
      context: .
      dockerfile: Dockerfile.vps-node
    container_name: nextdeploy-stress-web-01
    privileged: true
    cgroupns: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2201:22"
      - "3001:3000"
    networks:
      stress-cluster-net:
        ipv4_address: 172.28.0.11
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  web-02:
    build:
      context: .
      dockerfile: Dockerfile.vps-node
    container_name: nextdeploy-stress-web-02
    privileged: true
    cgroupns: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2202:22"
      - "3002:3000"
    networks:
      stress-cluster-net:
        ipv4_address: 172.28.0.12
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  web-03:
    build:
      context: .
      dockerfile: Dockerfile.vps-node
    container_name: nextdeploy-stress-web-03
    privileged: true
    cgroupns: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2203:22"
      - "3003:3000"
    networks:
      stress-cluster-net:
        ipv4_address: 172.28.0.13
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
