user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Upstream cluster pool: web-01, web-02, web-03
    upstream nextdeploy_cluster {
        least_conn;
        server 172.28.0.11:3000 max_fails=2 fail_timeout=3s;
        server 172.28.0.12:3000 max_fails=2 fail_timeout=3s;
        server 172.28.0.13:3000 max_fails=2 fail_timeout=3s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name localhost;

        # Health probe endpoint for the load balancer itself
        location = /lb-healthz {
            access_log off;
            return 200 "load-balancer-healthy\n";
        }

        location / {
            proxy_pass http://nextdeploy_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Failover: if one node is transitioning or fails, instantaneously retry next node
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
