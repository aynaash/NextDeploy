root = "."
tmp_dir = "tmp"

[build]
  cmd = 'set -e; mkdir -p tmp "$HOME/.nextdeploy/bin"; t="$HOME/.nextdeploy/bin/.nextdeploy.$$"; u="tmp/nextdeploy.$$"; trap "rm -f \"$t\" \"$u\"" EXIT; go build -o "$t" ./cli; cp "$t" "$u" && mv -f "$u" tmp/nextdeploy; mv -f "$t" "$HOME/.nextdeploy/bin/nextdeploy"'
  entrypoint = ["tmp/nextdeploy", "version"]
  include_ext = ["go", "toml", "js", "ts", "tmpl"]
  exclude_dir = ["tmp", "bin", "dist", "vendor", "daemon", "docs", "test-serverless-app", "node_modules"]
  include_dir = ["cli", "shared", "internal", "assets"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  delay = 300
  stop_on_error = true
  log = "air.log"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
