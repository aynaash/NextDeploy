# Generated by `nextdeploy generate-ci --preview` — re-run to regenerate.
#
# Every pull request gets an isolated, live preview stack named <app>-pr-<N>,
# with its own Worker and R2 asset bucket. Closing the PR tears it down (see
# preview-cleanup.yml).
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A rapid series of pushes should only ship the newest commit.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to comment the preview URL

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: |
          if [ -f bun.lockb ] || [ -f bun.lock ]; then
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            "$HOME/.bun/bin/bun" install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      # Download the pinned, prebuilt release and verify its published checksum.
      - name: Install nextdeploy CLI (pinned)
        env:
          CLI_VERSION: "v0.20.1"
        run: |
          set -euo pipefail
          VERSION="${CLI_VERSION#v}"
          ARCHIVE="nextdeploy_${VERSION}_linux_amd64.tar.gz"
          RELEASE_URL="https://github.com/aynaash/NextDeploy/releases/download/${CLI_VERSION}"
          TMP_DIR="$(mktemp -d "$RUNNER_TEMP/nextdeploy.XXXXXX")"
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --silent --show-error "$RELEASE_URL/$ARCHIVE" --output "$TMP_DIR/$ARCHIVE"
          curl --fail --location --silent --show-error "$RELEASE_URL/checksums.txt" --output "$TMP_DIR/checksums.txt"
          (cd "$TMP_DIR" && awk -v archive="$ARCHIVE" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' checksums.txt | sha256sum --check --status)
          tar -xzf "$TMP_DIR/$ARCHIVE" -C "$TMP_DIR" nextdeploy
          install -m 0755 "$TMP_DIR/nextdeploy" "$HOME/.local/bin/nextdeploy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      - name: Deploy preview
        id: deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NEXTDEPLOY_CF_STATE_KEY: ${{ secrets.NEXTDEPLOY_CF_STATE_KEY }}
          SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          set -o pipefail
          ENV_NAME="pr-${{ github.event.number }}"
          RUN_PREFIX=""
          if [ -n "${DOPPLER_TOKEN:-}" ]; then
            if ! command -v doppler >/dev/null 2>&1; then
              (curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh || wget -t 3 -qO- https://cli.doppler.com/install.sh) | sudo sh
            fi
            RUN_PREFIX="doppler run --"
            SUBDOMAIN=$(doppler secrets get CLOUDFLARE_WORKERS_SUBDOMAIN --plain 2>/dev/null || echo "$SUBDOMAIN")
          fi
          $RUN_PREFIX nextdeploy apply --environment "$ENV_NAME" --yes
          $RUN_PREFIX nextdeploy ship --environment "$ENV_NAME" --no-provision --verify | tee ship.log
          WORKER=$(grep -oE 'NEXTDEPLOY_WORKER_NAME=[^[:space:]]+' ship.log | tail -1 | cut -d= -f2)
          if [ -z "$WORKER" ]; then
            echo "::error::ship did not report NEXTDEPLOY_WORKER_NAME"; exit 1
          fi
          echo "url=https://${WORKER}.${SUBDOMAIN}.workers.dev" >> "$GITHUB_OUTPUT"

      # The HTML marker lets this job UPDATE its own comment on every push
      # instead of adding one per commit.
      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = "<!-- nextdeploy-preview -->";
            const body = marker + "\n Preview deployed: " + url +
              "\n\n_Updated for commit " + context.sha.slice(0, 7) + "._";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
