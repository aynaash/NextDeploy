name: Feature Request
description: Propose a new feature or improvement for NextDeploy
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: target
    attributes:
      label: Target / Area
      options:
        - All targets / Core CLI
        - VPS (Caddy + nextdeployd)
        - AWS Serverless
        - Cloudflare Workers
        - Secrets / CI-CD
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve or what workflow is blocked today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the CLI UX, config schema, or behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (optional)
      description: Any workarounds or alternative designs you considered.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this once the design is agreed on.
