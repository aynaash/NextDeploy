name: Bug Report
description: Report a reproducible bug in NextDeploy CLI, daemon, or deployment targets
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issue?** Please do not post it here — submit a private advisory via [SECURITY.md](../../blob/main/SECURITY.md).

  - type: dropdown
    id: target
    attributes:
      label: Deployment Target / Area
      options:
        - VPS (Caddy + nextdeployd)
        - AWS Serverless (Lambda + S3 + CloudFront)
        - Cloudflare Workers (R2 + nextcompile)
        - CLI / Local Build / Scaffolding
        - Secrets / Credstore / Doppler
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NextDeploy Version
      description: Output of `nextdeploy version`
      placeholder: "v0.20.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node.js version, Next.js version
      placeholder: "macOS arm64, Node 20.x, Next.js 15.x"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Run `nextdeploy ...`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Sanitized nextdeploy.yml (optional)
      description: Remove all secrets, tokens, account IDs, and private domains before pasting.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output (optional)
      description: Paste relevant CLI or daemon logs (redact any sensitive values).
      render: text
